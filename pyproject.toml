[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sarrthak-sitegen"
version = "2.0.0"
description = "Static site generator for sarrthak.com"
requires-python = ">=3.11"
dependencies = [
  "Jinja2>=3.1,<4",
  "markdown-it-py>=4,<5",
  "Pygments>=2.19,<3",
  "PyYAML>=6,<7",
]

[dependency-groups]
dev = [
  "Pillow>=11,<12",
  "brotli>=1.1,<2",
  "fonttools>=4.55,<5",
  "ruff>=0.12,<1",
]

[project.scripts]
sitegen = "sitegen.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sitegen*"]

[tool.ruff]
exclude = ["DESIGN-IS-2026-08-25", "docs"]
indent-width = 2
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
indent-style = "space"
