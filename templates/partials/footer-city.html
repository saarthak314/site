<footer class="footer footer--city">
  <p class="footer__copy"><span>{{ footer_line }}</span></p>
  <div class="city" aria-hidden="true" data-city style="--city-cols: {{ city.cols }}">
    <div class="city__sky"></div>
    <pre class="city__layer city__layer--stars">{{ city.stars }}</pre>
    <pre class="city__layer city__layer--far">{{ city.far }}</pre>
    <div class="city__ships"></div>
    <pre class="city__layer city__layer--near">{{ city.near }}</pre>
  </div>
</footer>
