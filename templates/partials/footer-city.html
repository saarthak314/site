<footer class="footer footer--city">
  <p class="footer__copy"><span>{{ footer_line }}</span></p>
  <div class="city" aria-hidden="true" data-city style="--city-cols: {{ city.cols }}">
    <div class="city__sky"></div>
    <div class="city__layer city__layer--stars" style="--rows: {{ city.rows.stars }}">{{ city.stars }}</div>
    <div class="city__layer city__layer--far" style="--rows: {{ city.rows.far }}">{{ city.far }}</div>
    <div class="city__ships"></div>
    <div class="city__layer city__layer--near" style="--rows: {{ city.rows.near }}">{{ city.near }}</div>
  </div>
</footer>
