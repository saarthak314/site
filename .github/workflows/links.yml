name: Link Check

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check published links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install generator
        run: uv sync --frozen
      - name: Build site
        run: uv run sitegen build --no-incremental
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        env:
          # github.com links are checked through the API, under the run's token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # .lycheeignore lists the sites that turn every checker away
          args: >-
            --root-dir "${{ github.workspace }}/docs"
            --verbose
            --no-progress
            --max-retries 3
            "docs/**/*.html"
